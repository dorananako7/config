# コピーモードをVim風にする
set -g mode-keys vi

# vキーで選択開始
bind-key -T copy-mode-vi v send-keys -X begin-selection

# yキーでコピーし、コピーモードを終了する
# macOSのクリップボードにも保存
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# クリップボード転送の重複を避ける
set -s set-clipboard off

# =====================================
# macOS + Windows用USキーボード
# ペインサイズ変更
# =====================================

# Alt + 左矢印（ESC + b）
bind-key -n M-b resize-pane -L 3

# Alt + 右矢印（ESC + f を送信する場合）
bind-key -n M-f resize-pane -R 3

# Alt + 上下矢印
bind-key -n M-Up resize-pane -U 3
bind-key -n M-Down resize-pane -D 3

# 代替操作：プレフィックス + Shift + hjkl
bind-key H resize-pane -L 3
bind-key J resize-pane -D 3
bind-key K resize-pane -U 3
bind-key L resize-pane -R 3

# 下段に横幅いっぱいのペインを作成
bind-key B split-window -v -f -l 30%
